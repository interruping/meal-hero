<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Hero</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛵</text></svg>" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #3a3a38; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; image-rendering: pixelated; }
    /* 부트 로더: 번들·3D 모델 로딩 동안 표시, init 완료 시 main.js가 제거 */
    #boot-loader { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #3a3a38;
      font-family: monospace; color: #efeeea; transition: opacity 0.35s; }
    #boot-loader .scooter { font-size: 56px; animation: boot-bounce 0.7s ease-in-out infinite; }
    #boot-loader .label { font-size: 17px; letter-spacing: 2px; }
    #boot-loader .label::after { content: ''; display: inline-block; width: 3ch; text-align: left;
      animation: boot-dots 1.2s steps(4) infinite; }
    #boot-loader .bar { width: 220px; height: 10px; border: 2px solid #efeeea; overflow: hidden; }
    #boot-loader .bar i { display: block; width: 40%; height: 100%; background: #b5372f;
      animation: boot-slide 1.1s ease-in-out infinite alternate; }
    @keyframes boot-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes boot-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    @keyframes boot-slide { 0% { transform: translateX(-60%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-loader">
    <div class="scooter">🛵</div>
    <div class="label">배달 준비 중</div>
    <div class="bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
